[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shardes"
version = "0.0.0"
description = "Sharded evolution strategies for JAX"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Andres Hernandez" }]
dependencies = [
    # Do not pin jax below 0.11. Modern sharding is the point: `from jax import shard_map`
    # is 0.8+, and AxisType is 0.11. (This used to say evosax was stuck at <0.7. It is not,
    # as of 0.2.0; see docs/00. The reason for the floor is what we need, not what they pin.)
    "jax>=0.11",
    "numpy",
    # Sobol direction numbers only: `ScrambledSobol` reads the Joe-Kuo table out of
    # scipy.stats rather than vendoring 2.5 MB of it. Already a jax dependency, so this
    # pins nothing new; listed because the import is ours.
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]
# Experiment drivers only: matplotlib for figures, pyyaml for sweep configs. Kept out of
# the core deps so the library floor stays jax + numpy.
experiments = ["matplotlib", "pyyaml"]
# Task adapters (C1.7). `playground` is MuJoCo Playground; it pulls mujoco, mujoco-mjx,
# brax, flax and jaxopt. All Apache 2.0 and free: MuJoCo has not needed a paid licence
# since DeepMind acquired it in 2021. Kept out of core so the library floor stays
# jax + numpy, and out of `experiments` so a figure rebuild does not need a physics engine.
#
# Verified before adding, because the project's whole premise is not being version-locked:
# every jax constraint in this chain is a LOWER bound (brax jax>=0.4.6, flax jax>=0.10,
# mujoco-mjx unpinned), so none of it can force a downgrade.
tasks = ["playground"]

[tool.hatch.build.targets.wheel]
packages = ["src/shardes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = [
    "gpu: needs a real GPU, deselected by default, run by hand before each gate",
    "slow: a statistical measurement rather than a unit test; skipped by --fast",
]
