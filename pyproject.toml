[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shardes"
version = "0.0.0"
description = "Sharded evolution strategies for JAX"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Do not pin jax below 0.11. The whole point is that evosax is stuck at <0.7.
    "jax>=0.11",
    "numpy",
    # Sobol direction numbers only: `ScrambledSobol` reads the Joe-Kuo table out of
    # scipy.stats rather than vendoring 2.5 MB of it. Already a jax dependency, so this
    # pins nothing new; listed because the import is ours.
    "scipy",
]

[project.optional-dependencies]
dev = ["pytest"]
# Experiment drivers only: matplotlib for figures, pyyaml for sweep configs. Kept out of
# the core deps so the library floor stays jax + numpy.
experiments = ["matplotlib", "pyyaml"]

[tool.hatch.build.targets.wheel]
packages = ["src/shardes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu'"
markers = [
    "gpu: needs a real GPU, deselected by default, run by hand before each gate",
    "slow: a statistical measurement rather than a unit test; skipped by --fast",
]
