# Sizing run for the paid sweep, on 2x T4 (16 GB each). Committed rather than generated by
# the kernel: CLAUDE.md says benchmark configs are committed before the run and cited by SHA,
# and a config written into the checkout at run time makes every result it produces stamp
# itself `dirty_worktree`, which is what G2 criterion 4 asks not to happen.
#
# Only the small end of the sweep fits on a T4, and that is the point: this fits a cost model
# on what fits and extrapolates with its shape stated. d=2048 is deliberately absent and the
# extrapolation has to carry that gap.
modes: [strong]
devices: [1, 2]
d_model: [256, 512]

population:
  256: [64, 256]
  512: [64, 256]

population_per_device:
  256: [32]
  512: [32]

strategies: [iid_gaussian, seed_regenerated, mirrored_lr1, lowrank_r1]
how: [A, B]

batch: 8
seq: 32
warmup: 3
repeats: 5
matmul_precision: highest
results_dir: results-calibration
