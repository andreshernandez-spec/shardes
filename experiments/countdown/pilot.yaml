# E13 pilot, ES arm. Committed before any rented run and cited by SHA, per ground rule 3.
#
# ES hyperparameters are Qiu et al.'s published ones, verbatim (arXiv:2509.24372,
# Appendix A.1): "The ES population size was N = 30, noise scale sigma = 0.001, and
# learning rate alpha = 5e-4 across all experiments." Their protocol: 500 iterations,
# 200 training samples, 2000 held-out for testing, RL stopped at matched total sample
# evaluations. The pilot runs fewer puzzles per generation than their 200; that is a
# budget statement, not a hyperparameter change, and docs/05 E13 frames it.
#
# strategy is overridden per arm from the command line... no, it is not: one config per
# arm, one results_dir per arm, so a result file can never mistake its strategy. Copy
# this file per arm and change exactly `strategy` and `results_dir`.

model: Qwen/Qwen2.5-0.5B-Instruct
strategy: mirrored_seed          # the Qiu algorithm; lr arms get their own configs
population: 30
sigma: 0.001
lr: 5.0e-4
seed: 0

puzzle_seed: 7
n_puzzles: 256                   # the rotating pool
puzzles_per_gen: 8
pad_to: 128                      # prompt budget; measured max for this template is ~110
max_new: 96
generations: 500
checkpoint_every: 10

results_dir: results-es-mirrored-seed
