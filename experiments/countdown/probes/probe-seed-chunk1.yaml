# Timing probe, not a result: the E13 seed arm at the library default chunk of 1, one
# member per scan step. This is the setting E17b ran, so it ties the E13 probe set to
# that grid. Everything else is probe-seed.yaml. 30 generations, one host, one SHA.
model: Qwen/Qwen2.5-0.5B-Instruct
strategy: mirrored_seed          # the Qiu algorithm; lr arms get their own configs
population: 30
sigma: 0.001
lr: 5.0e-7
seed: 0
eval_chunk: 1
puzzle_seed: 7
n_puzzles: 256                   # the rotating pool
puzzles_per_gen: 8
pad_to: 128                      # prompt budget; measured max for this template is ~110
max_new: 96
generations: 30
checkpoint_every: 1000
results_dir: results-probe-seed-chunk1
eval_seed: 1007
eval_puzzles: 2000
eval_every: 1000
eval_batch: 250
