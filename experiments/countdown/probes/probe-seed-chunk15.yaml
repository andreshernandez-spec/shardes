# Timing probe, not a result: the E13 seed arm with its evaluation un-chunked, so the
# 41% rank-1 advantage of Section 7 can be split into the perturbation scheme and the
# evaluation setting. `mirrored_seed` is Mirrored(SeedRegenerated(chunk)), and Mirrored
# halves the population, so chunk 15 is one vmap over all 15 members per side: the same
# batching LowRank does, which has no chunk knob and cannot be made to scan.
# Everything else is probe-seed.yaml. 30 generations, one host, one SHA, one seed.
model: Qwen/Qwen2.5-0.5B-Instruct
strategy: mirrored_seed          # the Qiu algorithm; lr arms get their own configs
population: 30
sigma: 0.001
lr: 5.0e-7
seed: 0
eval_chunk: 15
puzzle_seed: 7
n_puzzles: 256                   # the rotating pool
puzzles_per_gen: 8
pad_to: 128                      # prompt budget; measured max for this template is ~110
max_new: 96
generations: 30
checkpoint_every: 1000
results_dir: results-probe-seed-chunk15
eval_seed: 1007
eval_puzzles: 2000
eval_every: 1000
eval_batch: 250
