# E1 — estimator quality. Answers Gate G0, produces figure F5.
#
# COMMITTED BEFORE THE RUN. Results cite the commit SHA, so editing this file after a run
# invalidates the results that reference it. Add configs by committing a new file, never
# by editing this one mid-sweep (docs/conventions.md, "Benchmarking").
#
# The strategy axis is NOT here. It comes from src/shardes/strategies/registry.py, because
# the rank x scheme grid is non-rectangular and lives in one place (docs/01 C0.5). The
# commit SHA pins it just as tightly as it pins this file.
#
# Two YAML traps this file is written to avoid, both silent. `run.py` validates for them:
#   - `no`, `No`, `NO`, `off`, `on`, `yes` are booleans, and `~`/`null` are None. Never
#     write a shaping or scheme name bare if it could be read as one; quote it.
#     (`m:` and `n:` below are safe: PyYAML does not coerce single letters, unlike the
#     YAML 1.1 spec. Verified, not assumed.)
#   - `1e-3` is a STRING, not a float. YAML 1.1 needs a decimal point: `1.0e-3`. Plain
#     decimals like 0.001 are unambiguous, so use those.

seed: 0
replicates: 30              # R >= 30 per config (docs/01 C0.5)

# Per-config wall-clock budget. Checked after each replicate, so a config that blows it
# records what it has with truncated=true and the sweep moves on rather than stalling.
wall_clock_cap_s: 900

# Members are evaluated `chunk` at a time and the perturbation is re-derived per chunk
# (contraction Strategy A). NOT a tuning knob: without it the sweep cannot run.
#
# Measured on the RTX 3080 (16 GB, ~12.2 GB usable after JAX preallocation), unchunked:
# iid_gaussian OOMs from N = 1024, lowrank_r1 from N = 4096, seed_regenerated never.
#
# lowrank_r1 OOMing is the surprise, and it is not invariant 3 failing. The perturbation
# stays factored: A and B at N = 4096, r = 1 are 100 MB together. What blows up is the
# forward pass, because `apply` vmaps the model over members and the block's activations
# then carry a members axis at roughly 4-5 MB each. At N = 4096 that is 16-20 GB against a
# 100 MB perturbation. See docs/01 C0.2.
#
# 256 clears every strategy to N = 2^18. Bigger would mean fewer scan steps and better
# occupancy, but full rank OOMs unchunked at 1024, so the ceiling there is under it.
#
# Must be even: Mirrored pairs members as (2k, 2k+1) and an odd chunk splits a pair, losing
# the antithetic cancellation. load_config rejects an odd value rather than let every
# mirrored scheme raise partway through the sweep.
chunk: 256

model:
  kind: transformer_block
  m: 512
  n: 512                    # square, so every matrix has the same d_eff. Six matrices
                            # give d_eff = 1,572,864 full rank and 6,144 at rank 1.
  batch: 8
  seq: 32                   # the objective is a fixed input and target; the parameter
                            # dimension is what this experiment is about, not the data

axes:
  # Conditional on rank, and measured rather than guessed. Do not raise m/n before checking
  # memory: full rank at 2^18 and m=n=512 would be 275 TB of materialized perturbation,
  # which is what `chunk` above is for.
  population:
    # Full rank stops at 2^14. It never reaches N/d_eff = 1 anyway (2^18 only gets to 0.167),
    # and its job in F5 is to show curves NOT separating at N/d_eff << 1, which 0.010 does
    # two decades clear of the line.
    #
    # The two cells dropped here cost 9 of the sweep's 16.8 h, and `mirrored_hd_full` cannot
    # reach R = 30 in either of them. Under full rank the orthogonal_hd design dimension is
    # the whole 512x512 leaf, so every member pays two FWHTs of length 2^18 per leaf: one
    # replicate at N = 2^18 exceeds 400 s, which the 900 s cap would truncate to 2 replicates.
    # A 2-replicate point with an IQR is worse than no point. See docs/04 C3.3.
    full: [64, 256, 1024, 4096, 16384]
    # Rank 1 crosses N/d_eff = 1 near N = 6144 and reaches 42.7 at 2^18. That is the regime
    # the figure is about, and it is cheap: 10.8 s per replicate at 2^18, against 36.6 s for
    # full rank and >400 s for full-rank orthogonal_hd.
    low: [64, 256, 1024, 4096, 16384, 65536, 262144]
  sigma: [0.001, 0.01, 0.1]

  # The shaping axis is conditional on the scheme, and neither list is a subset of the
  # other. docs/01 C0.5 has the measurements; the short version:
  #
  #   - `none` is the right unshaped baseline under mirroring, because a mirrored pair is
  #     centred by construction. On the iid side it is a dead arm: raw fitness on this block
  #     gives relative bias 255 and cos(E[g], grad f) = 0.008, because f(theta) = 2.65
  #     against ||grad f|| = 1.02 and sigma divides that constant into the variance. R would
  #     have to be ~1e5 and this sweep budgets 30.
  #   - `centered` is the unbiased low-variance baseline on the iid side, and must NOT be
  #     paired with mirroring: the pair already cancels f_bar, so the n/(n-1) correction
  #     over-corrects and the estimator targets n/(n-1) grad f, 6.7% the wrong way at n=16.
  #
  # This used to be a flat [none, centered_ranks], which got the mirrored side right and
  # spent 84 configs on the dead iid arm while never measuring an unbiased iid baseline.
  # Corrected before any results existed.
  shaping:
    iid: [centered, centered_ranks]
    mirrored: [none, centered_ranks]
